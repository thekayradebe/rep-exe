<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>REP.exe</title>
  <meta name="description" content="A personal Monday–Friday dumbbell strength log.">
  <meta name="theme-color" content="#e7d6f7">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="REP.exe">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <div class="inner">
      <header class="brand">
        <span class="logo">REP<span>.exe</span></span>
        <span id="save-status" class="save-status" role="status"></span>
      </header>
      <main id="content">
        <noscript><p>REP.exe needs JavaScript turned on.</p></noscript>
      </main>
    </div>
    <p id="toast" class="toast" role="status" aria-live="polite" hidden></p>
    <nav class="bottom" aria-label="Main navigation">
      <button type="button" data-view="workout" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6v12M3.5 9v6M17.5 6v12M20.5 9v6M6.5 12h11"/></svg> Workout
      </button>
      <button type="button" data-view="progress" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg> Progress
      </button>
    </nav>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
